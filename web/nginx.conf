server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API exposed under /api: strip the prefix and forward to the
    # malprobe service (docker network DNS). /api/files -> /files, etc.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://malprobe:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # SPA fallback: let Vue Router handle client-side routes
    # (/report/:id, /hash/:sha256, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
