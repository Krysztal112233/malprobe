# Static base settings for malprobe.
# Environment-specific values (e.g. database DSN) are provided via MALPROBE_*
# env vars (see .env). Environment variables take precedence over this file.

addr = "0.0.0.0:8000"

[database]
# dsn comes from the MALPROBE_DATABASE_DSN env var (see .env)
slow_statements_logging_threshold = 5000
max_connections = 32
min_connections = 4
migrate = true

[worker]
# Shared by the backend (enqueue) and the worker (consume) via pgmq.
queue_name = "scan"
# Worker-only settings (the backend ignores the unknown section).
concurrency = 2
vt_seconds = 300
poll_timeout_ms = 5000
poll_interval_ms = 500
