# Static base settings for malprobe.
# Environment-specific values (e.g. database DSN) are provided via MALPROBE_*
# env vars (see .env). Environment variables take precedence over this file.

addr = "0.0.0.0:8000"

[database]
# dsn comes from the MALPROBE__DATABASE__DSN env var (see .env)
slow_statements_logging_threshold = 5000
max_connections = 32
min_connections = 4

[worker]
# Shared by the backend (enqueue) and the worker (consume) via pgmq.
queue_name = "scan"
# Worker-only settings (the backend ignores the unknown section).
concurrency = 2
vt_seconds = 300
poll_timeout_ms = 5000
poll_interval_ms = 500
# ClamAV INSTREAM endpoint (compose overrides it with the `clamav` service).
clamd_addr = "127.0.0.1:3310"
clamd_timeout_seconds = 120
# Give up after this many scan attempts instead of retrying forever.
max_read_ct = 5
# Upper bound for downloaded file bytes; larger responses are rejected.
# 25 MiB matches clamd's INSTREAM size limit, keeping worker memory bounded.
max_download_bytes = 26214400
