services:
  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    command: -c 'max_connections=2048'
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - 5432:5432

  clamav:
    build:
      context: .
      dockerfile: Dockerfile
      target: clamav
    image: ghcr.io/krysztal112233/malprobe-clamav:latest
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "3310:3310"

  malprobe:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: ghcr.io/krysztal112233/malprobe:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      postgres:
        condition: service_started

volumes:
  postgres-data:
