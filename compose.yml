services:
  postgres:
    # pgmq image: stock postgres 18 with the pgmq extension pre-installed
    # (the extension still has to be created via `CREATE EXTENSION`, done by the backend migration)
    image: ghcr.io/pgmq/pg18-pgmq:v1.12.0
    restart: unless-stopped
    command: -c 'max_connections=2048'
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    image: ghcr.io/krysztal112233/malprobe-migration:latest
    # Runs the pending migrations once, then exits; the backend/worker only
    # start after it completes successfully.
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  clamav:
    build:
      context: .
      dockerfile: Dockerfile
      target: clamav
    image: ghcr.io/krysztal112233/malprobe-clamav:latest
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "3310:3310"

  malprobe:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: ghcr.io/krysztal112233/malprobe:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      backend-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ghcr.io/krysztal112233/malprobe-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the clamd endpoint is the `clamav` service.
      MALPROBE__WORKER__CLAMAV__CLAMD_ADDR: "clamav:3310"
      # Keep downloaded bytes across worker container restarts.
      MALPROBE__WORKER__STORAGE_ROOT: "/storage"
    volumes:
      - file-storage:/storage
    depends_on:
      backend-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ghcr.io/krysztal112233/malprobe-web:latest
    restart: unless-stopped
    ports:
      # NGINX serves the built frontend and proxies /api -> malprobe:8000.
      - 8080:80
    depends_on:
      malprobe:
        condition: service_started

volumes:
  postgres-data:
  file-storage:
