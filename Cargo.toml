[workspace]
members = ["./crates/malprobe", "./crates/migration/", "crates/malprobe-common"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
config = { version = "0.15.25", features = ["toml"] }
dotenvy = "0.15.7"
itertools = "0.15.0"
log = "0.4.33"
mimalloc = "0.1.52"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tap = "1.0.1"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["chrono", "url", "uuid", "axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.24.0", features = ["v7"] }

malprobe-common = { path = "./crates/malprobe-common/" }
migration = { path = "./crates/migration/" }

[workspace.dependencies.sea-orm]
version = "1.1.20"
features = ["runtime-tokio", "sqlx-postgres"]

[workspace.dependencies.sea-orm-migration]
version = "1.1.20"
features = ["runtime-tokio", "sqlx-postgres"]

[workspace.dependencies.axum-valid]
default-features = false
features = ["basic", "garde"]
version = "0.25.0"
